# XcodeGen spec: the GitHub build turns this into Fretbook.xcodeproj.
name: Fretbook
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  Fretbook:
    type: application
    platform: iOS
    sources:
      - path: Fretbook
    scheme: {}
    settings:
      base:
        # Keep this the same forever: changing it installs a *new* app with empty data.
        PRODUCT_BUNDLE_IDENTIFIER: app.fretbook.notes.r8kq4
        PRODUCT_NAME: Fretbook
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Fretbook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        # Shows the data file in the Files app (On My iPad → Fretbook) for easy backups.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
